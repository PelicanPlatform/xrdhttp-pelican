name: Lint

# Verifies that the C++ sources are clang-formatted (per the repo's
# .clang-format).  This is a check only; formatting fixes are applied
# locally, e.g. via the repo's pre-commit hooks.
#
# Deliberately triggered on `pull_request`, NOT `pull_request_target`:
# the latter runs with the base repository's write token, secrets, and
# cache scope, so checking out and processing fork code in that context
# is a "pwn request" vulnerability -- and actions/checkout now refuses
# to do it, which broke this workflow for every fork PR.  A pure check
# needs no write access, so the untrusted-PR-context `pull_request`
# event is the right trigger.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ClangFormat
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          git ls-files '*.cc' '*.hh' '*.h' '*.cpp' '*.hpp' \
            | xargs -r clang-format --dry-run --Werror -style=file
